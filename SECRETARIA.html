<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Registro de Sessão Maçônica</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --background-color: #f7fafc;
            --card-background: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-background);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        h2 {
            color: var(--secondary-color);
            font-size: 1.2rem;
            margin-top: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        h3 {
            color: var(--text-color);
            font-size: 1rem;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        select,
        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        .input-extra {
            margin-top: 8px;
            background-color: #fffde7;
            border: 1px solid #fff59d;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .dynamic-list {
            margin-bottom: 15px;
        }

        .dynamic-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .composite-item {
            background: #f8fafc;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            padding: 8px 15px;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .btn-remove {
            background-color: #dc3545;
            color: white;
            padding: 10px 15px;
        }

        .btn-remove:hover {
            background-color: #c82333;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 30px;
            border-radius: 6px;
        }

        .btn-submit:hover {
            background-color: #11243f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ata de Sessão Maçônica</h1>
    
    <form id="ataForm">
        <!-- DADOS INICIAIS -->
        <h2>Dados Iniciais da Sessão</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="dataSessao">DATA:</label>
                <input type="date" id="dataSessao" required>
            </div>
            <div class="form-group">
                <label for="horaSessao">HORA:</label>
                <input type="time" id="horaSessao" value="20:00" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="veneravel">Venerável Mestre:</label>
                <!-- Atributo data-default armazena qual nome deve vir pré-selecionado da lista -->
                <select id="veneravel" data-default="Ir∴ MARCOS FERREIRA VASCONCELOS" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="veneravel_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
            <div class="form-group">
                <label for="primVigilante">1º Vigilante:</label>
                <select id="primVigilante" data-default="Ir∴ PAULO HENRIQUE CUNHA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="primVigilante_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="segVigilante">2º Vigilante:</label>
                <select id="segVigilante" data-default="Ir∴ ISAIAS FERREIRA DOS SANTOS" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="segVigilante_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
            <div class="form-group">
                <label for="orador">Orador:</label>
                <select id="orador" data-default="Ir∴ EMERSON LUIZ TEIXEIRA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="orador_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="secretario">Secretário:</label>
                <select id="secretario" data-default="Ir∴ MAXIMIANO EDUARDO PEREIRA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="secretario_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
            <div class="form-group">
                <label for="tesoureiro">Tesoureiro:</label>
                <select id="tesoureiro" data-default="Ir∴ MAX FERREIRA DA SILVA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="tesoureiro_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="chanceler">Chanceler:</label>
                <select id="chanceler" data-default="Ir∴ FERNANDO MAGNO ROCHA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="chanceler_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
            <div class="form-group">
                <label for="mestreCerimonias">Mestre de Cerimônias:</label>
                <select id="mestreCerimonias" data-default="Ir∴ LUIZ LUCIANO GARCIA" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="mestreCerimonias_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
        </div>

        <!-- BALAUSTRES LIDOS -->
        <h2>Balaustres Lidos</h2>
        <div class="form-group">
            <div id="balaustresContainer" class="dynamic-list"></div>
            <button type="button" class="btn-add" onclick="addSimpleField('balaustresContainer', 'Balaustre nº')">＋ Adicionar Balaustre</button>
        </div>

        <!-- PRESENÇAS -->
        <h2>Presenças</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="qtdQuadro">Quantidade de Irmãos do Quadro Presentes:</label>
                <input type="number" id="qtdQuadro" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="qtdVisitantes">Quantidade de Irmãos Visitantes Presentes:</label>
                <input type="number" id="qtdVisitantes" min="0" value="0">
            </div>
        </div>

        <!-- EXPEDIENTES RECEBIDOS -->
        <h2>Expedientes Recebidos</h2>
        <div class="form-group">
            <div id="expedientesContainer" class="dynamic-list"></div>
            <button type="button" class="btn-add" onclick="addSimpleField('expedientesContainer', 'Expediente')">＋ Adicionar Expediente</button>
        </div>

        <!-- SACO DE PROPOSTAS E INFORMAÇÕES -->
        <h2>Saco de Propostas e Informações</h2>
        <div class="form-group">
            <label for="sacoPropostas">Saco de Proposta e Informações (Resultado Geral):</label>
            <input type="text" id="sacoPropostas" placeholder="Ex: Reteve X óbolos, ou X propostas de admissão">
        </div>
        <div class="form-group">
            <label>Descrição detalhada do que veio no Saco de Propostas:</label>
            <div id="descSacoContainer" class="dynamic-list"></div>
            <button type="button" class="btn-add" onclick="addSimpleField('descSacoContainer', 'Descrição do item')">＋ Adicionar Item do Saco</button>
        </div>

        <!-- ORDEM DO DIA -->
        <h2>Ordem do Dia</h2>
        <div class="form-group">
            <div id="ordemDiaContainer" class="dynamic-list"></div>
            <button type="button" class="btn-add" onclick="addSimpleField('ordemDiaContainer', 'Item da Ordem do Dia')">＋ Adicionar Item à Ordem do Dia</button>
        </div>

        <!-- TRABALHO E INSTRUÇÃO -->
        <h2>Tempo de Instrução</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="trabalhoInstrucao">Trabalho no Tempo de Instrução:</label>
                <input type="text" id="trabalhoInstrucao" placeholder="Título ou tema do trabalho">
            </div>
            <div class="form-group">
                <label for="irmaoTrabalho">Nome do Irmão que apresentou o trabalho:</label>
                <select id="irmaoTrabalho" data-default="" onchange="toggleExtraInput(this)"></select>
                <input type="text" id="irmaoTrabalho_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
        </div>

        <!-- PALAVRA A BEM GERAL E DA ORDEM -->
        <h2>Palavra a Bem Geral e da Ordem</h2>

        <!-- COLUNA DO SUL -->
        <h3>Coluna do Sul</h3>
        <div id="colunaSulContainer" class="dynamic-list"></div>
        <button type="button" class="btn-add" style="margin-bottom: 20px;" onclick="addCompositeField('colunaSulContainer')">＋ Adicionar Fala na Coluna do Sul</button>

        <!-- COLUNA DO NORTE -->
        <h3>Coluna do Norte</h3>
        <div id="colunaNorteContainer" class="dynamic-list"></div>
        <button type="button" class="btn-add" style="margin-bottom: 20px;" onclick="addCompositeField('colunaNorteContainer')">＋ Adicionar Fala na Coluna do Norte</button>

        <!-- COLUNA DO ORIENTE -->
        <h3>Coluna do Oriente</h3>
        <div id="colunaOrienteContainer" class="dynamic-list"></div>
        <button type="button" class="btn-add" style="margin-bottom: 20px;" onclick="addCompositeField('colunaOrienteContainer')">＋ Adicionar Fala na Coluna do Oriente</button>

        <!-- COLUNA DO ALTAR -->
        <h3>Coluna do Altar</h3>
        <div id="colunaAltarContainer" class="dynamic-list"></div>
        <button type="button" class="btn-add" style="margin-bottom: 20px;" onclick="addCompositeField('colunaAltarContainer')">＋ Adicionar Fala na Coluna do Altar</button>

        <!-- HORÁRIO DE TÉRMINO -->
        <h2>Encerramento</h2>
        <div class="form-group">
            <label for="horaTermino">Horário do Término:</label>
            <input type="time" id="horaTermino" required>
        </div>

        <button type="button" class="btn-submit" onclick="gerarDocumentoTexto()">GRAVAR E GERAR DOCUMENTO TEXTO</button>
    </form>
</div>

<script>
    // Lista de Irmãos fornecida
    const arrayIrmaos = [
        "Ir∴ ALDO BORGES DE FREITAS", "Ir∴ ALEXSANDER FARIA DO VAL OLIVEIRA", "Ir∴ ANDERSON CARDOSO COSTA",
        "Ir∴ ANDRE LUIZ BORGES", "Ir∴ AROLDO BOLÍVAR DE ALVARENGA", "Ir∴ ARTUR IASCO PEREIRA",
        "Ir∴ CARLOS ALBERTO BATISTA", "Ir∴ CLEUBER MARCELO PASCOA", "Ir∴ DOMICIO FERREIRA NEVES",
        "Ir∴ EMERSON LUIZ TEIXEIRA", "Ir∴ FERNANDO MAGNO ROCHA", "Ir∴ HENRIQUE ROSALEN",
        "Ir∴ ISAIAS FERREIRA DOS SANTOS", "Ir∴ JEFFERSON BATISTA DE PAULA SILVA", "Ir∴ JOAO CAIRO DE PAULA",
        "Ir∴ JOSE MARTINS JUNIOR", "Ir∴ JOSE RUBENS BUIATTI", "Ir∴ LEANDRO ZANATTA CARCANHOLO",
        "Ir∴ LEMUEL DELFINO ALVES", "Ir∴ LINDOMAR APARECIDO FURNIEL DE OLIVEIRA", "Ir∴ LUIZ LUCIANO GARCIA",
        "Ir∴ LUIZ FERNANDO MARRA DE AQUINO", "Ir∴ MARCIO PATRICIO GONÇALVES DA SILVEIRA", "Ir∴ MARCOS FERREIRA VASCONCELOS",
        "Ir∴ MAX FERREIRA DA SILVA", "Ir∴ MAXIMIANO EDUARDO PEREIRA", "Ir∴ NÉLIO AMIM MATTAR",
        "Ir∴ OTANES BARCELOS OLIVEIRA NETO", "Ir∴ PAULO HENRIQUE CUNHA", "Ir∴ RAPHAEL CARVALHO CARDOSO",
        "IrZEN RODRIGO DE ALMEIDA SANTOS", "Ir∴ RONNAN CARLOS ALVES MENDES", "Ir∴ SÉRGIO ANTÔNIO ABRAÃO FREITAS"
    ];

    // Popula as listas suspensas (selects) fixas na inicialização do sistema
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dataSessao').value = new Date().toISOString().split('T')[0];
        
        const idsSelectsFixos = ['veneravel', 'primVigilante', 'segVigilante', 'orador', 'secretario', 'tesoureiro', 'chanceler', 'mestreCerimonias', 'irmaoTrabalho'];
        
        idsSelectsFixos.forEach(id => {
            const selectEl = document.getElementById(id);
            const valorAlvo = selectEl.getAttribute('data-default');
            
            selectEl.innerHTML = '';
            
            if (id === 'irmaoTrabalho') {
                selectEl.appendChild(new Option("-- Selecione um Irmão --", ""));
            }

            arrayIrmaos.forEach(nome => {
                const opt = new Option(nome, nome);
                if (nome === valorAlvo) {
                    opt.selected = true;
                }
                selectEl.appendChild(opt);
            });
            
            selectEl.appendChild(new Option("-- Outro (Digitar nome...) --", "outro"));
        });
    });

    function toggleExtraInput(selectElement) {
        const extraInput = document.getElementById(selectElement.id + '_extra');
        if (selectElement.value === 'outro') {
            extraInput.style.display = 'block';
            extraInput.required = true;
        } else {
            extraInput.style.display = 'none';
            extraInput.required = false;
            extraInput.value = '';
        }
    }

    function obterValorCampoSelect(idSelect) {
        const select = document.getElementById(idSelect);
        if (select.value === 'outro') {
            const inputExtra = document.getElementById(idSelect + '_extra');
            return inputExtra.value.trim() ? "Ir∴ " + inputExtra.value.trim().replace(/^Ir∴\s*/i, '') : '';
        }
        return select.value;
    }

    function addSimpleField(containerId, placeholderText) {
        const container = document.getElementById(containerId);
        const div = document.createElement('div');
        div.className = 'dynamic-item';
        div.innerHTML = `
            <input type="text" placeholder="${placeholderText}" class="dynamic-input-value">
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(div);
    }

    let contadorCompostos = 0;
    function addCompositeField(containerId) {
        contadorCompostos++;
        const idDinamico = 'comp_select_' + contadorCompostos;
        const container = document.getElementById(containerId);
        const div = document.createElement('div');
        div.className = 'composite-item';
        
        let opcoesHtml = `<option value="" selected>-- Selecione um Irmão --</option>`;
        arrayIrmaos.forEach(nome => {
            opcoesHtml += `<option value="${nome}">${nome}</option>`;
        });
        opcoesHtml += `<option value="outro">-- Outro (Digitar nome...) --</option>`;

        div.innerHTML = `
            <div style="margin-bottom: 10px;">
                <label style="font-size: 0.85rem; color: #555;">Irmão que falou:</label>
                <select id="${idDinamico}" class="comp-irmao-select" onchange="toggleExtraInput(this)">
                    ${opcoesHtml}
                </select>
                <input type="text" id="${idDinamico}_extra" class="input-extra" placeholder="Digite o nome do Ir∴" style="display: none;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="font-size: 0.85rem; color: #555;">Descrição do que falou:</label>
                <textarea placeholder="O irmão fez uso da palavra para..." class="comp-fala"></textarea>
            </div>
            <div style="text-align: right;">
                <button type="button" class="btn-remove" style="padding: 5px 10px; font-size: 0.85rem;" onclick="this.parentElement.parentElement.remove()">✕ Remover esta fala</button>
            </div>
        `;
        container.appendChild(div);
    }

    function dataPorExtenso(dataStr) {
        if(!dataStr) return "";
        const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const numerosPorExtenso = {
            1: "um", 2: "dois", 3: "três", 4: "quatro", 5: "cinco", 6: "seis", 7: "sete", 8: "oito", 9: "nove", 10: "dez",
            11: "onze", 12: "doze", 13: "treze", 14: "quatorze", 15: "quinze", 16: "dezesseis", 17: "dezessete", 18: "dezoito",
            19: "dezenove", 20: "vinte", 21: "vinte e um", 22: "vinte e dois", 23: "vinte e três", 24: "vinte e quatro",
            25: "vinte e cinco", 26: "vinte e seis", 27: "vinte e sete", 28: "vinte e oito", 29: "vinte e nove", 30: "trinta", 31: "trinta e um"
        };
        const partes = dataStr.split('-');
        const ano = partes[0];
        const mes = meses[parseInt(partes[1], 10) - 1];
        const diaNum = parseInt(partes[2], 10);
        let diaExtenso = numerosPorExtenso[diaNum] || diaNum;
        if(diaNum === 1) diaExtenso = "primeiro";
        return `Aos ${diaExtenso} dias do mês de ${mes} de ${ano}`;
    }

    function obterValoresListaSimples(containerId) {
        const inputs = document.getElementById(containerId).querySelectorAll('.dynamic-input-value');
        const valores = [];
        inputs.forEach(input => {
            if(input.value.trim() !== "") valores.push(input.value.trim());
        });
        return valores;
    }

    function obterValoresListaComposta(containerId) {
        const itens = document.getElementById(containerId).querySelectorAll('.composite-item');
        const valores = [];
        itens.forEach(item => {
            const select = item.querySelector('.comp-irmao-select');
            let nomeIrmao = select.value;
            if(nomeIrmao === 'outro') {
                const extra = item.querySelector('.input-extra');
                nomeIrmao = extra.value.trim() ? "Ir∴ " + extra.value.trim().replace(/^Ir∴\s*/i, '') : 'Ir∴ Desconhecido';
            }
            const fala = item.querySelector('.comp-fala').value.trim();
            if(nomeIrmao !== "" || fala !== "") {
                valores.push(`- ${nomeIrmao}: ${fala}`);
            }
        });
        return valores;
    }

    function gerarDocumentoTexto() {
        const dataSessao = document.getElementById('dataSessao').value;
        const horaSessao = document.getElementById('horaSessao').value;
        
        const veneravel = obterValorCampoSelect('veneravel');
        const primVigilante = obterValorCampoSelect('primVigilante');
        const segVigilante = obterValorCampoSelect('segVigilante');
        const orador = obterValorCampoSelect('orador');
        const secretario = obterValorCampoSelect('secretario');
        const tesoureiro = obterValorCampoSelect('tesoureiro');
        const chanceler = obterValorCampoSelect('chanceler');
        const mestreCerimonias = obterValorCampoSelect('mestreCerimonias');
        const irmaoTrabalho = obterValorCampoSelect('irmaoTrabalho');
        
        const qtdQuadro = document.getElementById('qtdQuadro').value;
        const qtdVisitantes = document.getElementById('qtdVisitantes').value;
        const sacoPropostas = document.getElementById('sacoPropostas').value;
        const trabalhoInstrucao = document.getElementById('trabalhoInstrucao').value;
        const horaTermino = document.getElementById('horaTermino').value;

        const introducaoDataExtenso = dataPorExtenso(dataSessao);
        
        let textoFinal = `${introducaoDataExtenso}, achando-se abertos os Augustos trabalhos da nossa Ordem em Sessão Ordinária – EM GRAU DE APRENDIZ reuniram-se os obreiros às ${horaSessao.replace(':', ' h ')}, com número legal, no Templo da Aug∴Resp∴Loj∴ Simb∴ Alpha e Ômega N° 3402, situada à Rua do Fazendeiro nº 680, com Abertura Ritualística, debaixo do Ponto Geométrico conhecido dos Filhos da V∴ ao Or∴ de Uberlândia-MG.\n\n`;
        
        textoFinal += `Os cargos em Loja foram ocupados da seguinte maneira: empunhando o Malhete da Sabedoria o Venerável Mestre ${veneravel}; 1º Vigilante ${primVigilante}, 2° Vigilante ${segVigilante}, Orador ${orador}, Secretário Substituto ${secretario}, Tesoureiro Substituto ${tesoureiro}, Chanceler Substituto ${chanceler} e Mestre de Cerimônias Substituto ${mestreCerimonias}.\n`;
        textoFinal += `Após o preenchimento dos lugares vagos e da Câmara do Meio pelo Ir∴ Mestre de Cerimônias, é verificada a segurança do Templo.\n\n`;

        // Balaustres
        textoFinal += `BALAUSTRES LIDOS:\n`;
        const balaustres = obterValoresListaSimples('balaustresContainer');
        if(balaustres.length > 0) {
            balaustres.forEach(item => { textoFinal += `- ${item}\n`; });
        } else {
            textoFinal += `- Nenhum balaustre lido.\n`;
        }
        textoFinal += `\n`;

        // Presenças
        textoFinal += `QUANTIDADE DE IRMÃOS DO QUADRO PRESENTES: ${qtdQuadro}\n`;
        textoFinal += `QUANTIDADE DE IRMÃOS VISITANTES PRESENTES: ${qtdVisitantes}\n\n`;

        // Expedientes
        textoFinal += `EXPEDIENTES RECEBIDOS:\n`;
        const expedientes = obterValoresListaSimples('expedientesContainer');
        if(expedientes.length > 0) {
            expedientes.forEach(item => { textoFinal += `- ${item}\n`; });
        } else {
            textoFinal += `- Nenhum expediente recebido.\n`;
        }
        textoFinal += `\n`;

        // Saco de Propostas
        textoFinal += `SACO DE PROPOSTA E INFORMAÇÕES: ${sacoPropostas || "Nenhum registro"}\n\n`;
        
        textoFinal += `DESCRIÇÃO DO QUE VEIO NO SACO DE PROPOSTAS:\n`;
        const descSaco = obterValoresListaSimples('descSacoContainer');
        if(descSaco.length > 0) {
            descSaco.forEach(item => { textoFinal += `- ${item}\n`; });
        } else {
            textoFinal += `- Nada a declarar.\n`;
        }
        textoFinal += `\n`;

        // Ordem do Dia
        textoFinal += `ORDEM DO DIA:\n`;

        textoFinal += `\n`;

        // Altar

        textoFinal += `\n`;

        // Horário de Término
        textoFinal += `HORARIO DO TERMINO: ${horaTermino ? horaTermino + ' h' : 'Não informado'}\n`;

        const blob = new Blob([textoFinal], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Ata_Sessao_${dataSessao}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
